[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muda"
version = "0.1.0"
description = "CUDA-to-Metal compatibility layer & PyTorch custom extension bridge for Apple Silicon"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0 WITH LLVM-exception" }
authors = [
  { name = "MUDA Contributors" }
]
keywords = ["cuda", "metal", "apple-silicon", "pytorch", "gpu"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
torch = ["torch>=2.0", "numpy>=1.24"]
numba = ["numba>=0.58", "numpy>=1.24"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

